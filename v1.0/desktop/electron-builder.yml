appId: edu.assessly.desktop
productName: Assessly
copyright: Copyright © Assessly

directories:
  output: release
  buildResources: build

files:
  - src/**/*
  - package.json

extraResources:
  - from: ../web-client/dist
    to: web-client
    filter:
      - '**/*'

win:
  target:
    - nsis
  artifactName: Assessly-Setup-${version}.${ext}
  # Set CSC_LINK and CSC_KEY_PASSWORD env vars for Authenticode signing in CI.

mac:
  target:
    - dmg
  artifactName: Assessly-${version}.${ext}
  category: public.app-category.education
  hardenedRuntime: true
  gatekeeperAssess: false
  # Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID for notarization.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

dmg:
  title: Assessly ${version}

publish:
  provider: github
  owner: omaaryouussef
  repo: Assessly
